<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Download webpage as PDF</title>
    <style>
      :root { --ink: #17191f; --muted: #626975; --paper: #fffdf9; --accent: #ff6852; --white: #fff; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--ink); background: var(--paper); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(620px, calc(100% - 40px)); text-align: center; }
      .mark { display: grid; width: 42px; height: 42px; margin: 0 auto 26px; place-items: center; border-radius: 9px; color: var(--white); background: var(--accent); font-size: 24px; font-weight: 800; transform: rotate(-8deg); }
      p { max-width: 480px; margin: 18px auto 28px; color: var(--muted); font-size: 18px; line-height: 1.5; }
      h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); letter-spacing: -.06em; line-height: 1; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 18px; border-radius: 8px; font-weight: 800; text-decoration: none; }
      .primary { color: var(--white); background: var(--accent); }
      .secondary { border: 1px solid #dedee4; color: var(--ink); background: var(--white); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↗</div>
      <h1>Page not found</h1>
      <p>This page does not exist or may have moved. Go back to the homepage or get the extension from the Chrome Web Store.</p>
      <div class="actions">
        <a class="primary" href="/">Back to homepage</a>
        <a class="secondary" href="https://chromewebstore.google.com/detail/download-web-as-pdf/ooaclffhlgljhnodmnecbafldiinnagg?utm_medium=website" target="_blank" rel="noreferrer">Add to Chrome</a>
      </div>
    </main>
  </body>
</html>
